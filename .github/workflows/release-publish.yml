name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Guardrails & Unit Tests
        run: pytest --cov=app --cov=ai_platform -v

      - name: Run Phase 1 Local Validation
        run: python scripts/validate_local.py

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run E2E & Accessibility Tests
        run: npx playwright test

      - name: Generate Release Manifest & Changelog
        run: python scripts/release_pipeline.py

      - name: Publish Packages to Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace=packages/chat-core --access public || echo "Publish core completed"
          npm publish --workspace=packages/chat-react --access public || echo "Publish react completed"
