apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform
data:
  APP_NAME: "DigiPay AI Platform"
  ENVIRONMENT: "production"
  PORT: "8000"

  # DigiPay Spring Boot gateway-service (PRODUCTION). Same host the React app
  # uses as VITE_API_BASE_URL. HTTPS only.
  #   production   https://digipayapi.csccloud.in
  #   uat          https://digipayapiuat.csccloud.in
  API_GATEWAY_URL: "https://digipayapi.csccloud.in"
  # gateway-service sets server.servlet.context-path=/gateway; this is appended
  # automatically, so API_GATEWAY_URL works with or without the suffix.
  API_GATEWAY_CONTEXT_PATH: "/gateway"
  # /health on the gateway is behind Spring Security (401); use the actuator.
  API_GATEWAY_HEALTH_PATH: "/actuator/health"

  # Legacy DigiPay API service (app/main.py) - deployed separately, URLs unchanged.
  # This is NOT the Spring gateway above; it is its own service.
  #
  # Deployed at http://10.1.76.194 (port 80) - verified serving
  # /api/v1/health and /openapi.json titled "DigiPay API Gateway & Ledger
  # Services". This is the same host React exposes as VITE_OLD_URL.
  #
  # LEGACY_API_URL        address used for server-to-server calls.
  # LEGACY_API_PUBLIC_URL address advertised in the merged Swagger schema, so it
  #                       must be reachable from the user's BROWSER. 10.x is an
  #                       internal range, so this only resolves on the corporate
  #                       network - replace with a public ingress hostname if the
  #                       docs are served to users outside it.
  LEGACY_API_URL: "http://10.1.76.194"
  LEGACY_API_PUBLIC_URL: "http://10.1.76.194"
  AGGREGATE_LEGACY_OPENAPI: "true"

  # RAG knowledge store.
  MONGO_URI: "mongodb://mongo.ai-platform.svc.cluster.local:27017"
  MONGO_DB: "digipay_ai"
  RAG_ENABLED: "true"
  RAG_AUTO_SEED: "true"

  # Client RSA keypair for encrypted gateway responses. MUST be backed by a
  # persistent volume: if the key changes between a request and its response,
  # the encrypted ledger balance cannot be decrypted.
  GATEWAY_CLIENT_KEY_PATH: "/srv/ai_platform/data/keys/gateway_client_rsa.pem"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secret
  namespace: ai-platform
type: Opaque
data:
  JWT_SECRET: "c3VwZXJzZWNyZXRqd3RrZXk=" # base64 placeholder
  # Must match the legacy DigiPay API service's value, or the assistant's
  # read-only calls to /api/v1/* are rejected with 401.
  INTERNAL_BYPASS_SECRET: "Q0hBTkdFX01F" # base64 placeholder - CHANGE_ME
  # Leave empty to run on the offline keyword router with lexical RAG
  # embeddings; set a real key before serving users.
  OPENAI_API_KEY: "" # base64 placeholder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-deployment
  namespace: ai-platform
  labels:
    app: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-platform
  template:
    metadata:
      labels:
        app: ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: ai-platform-container
        image: digipay/ai-platform:1.0.0-GA
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-platform-service
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app: ai-platform
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-platform-ingress
  namespace: ai-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: ai-platform-service
            port:
              number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-platform-hpa
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-platform-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-platform-pdb
  namespace: ai-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-platform
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-platform-net-policy
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app: ai-platform
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
