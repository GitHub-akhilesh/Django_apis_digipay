name: DigiPay AI Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Formatting (Black)
        run: black --check ai_platform/

      - name: Lint Code (Ruff)
        run: ruff check ai_platform/

      - name: Run Static Typing (Mypy)
        run: mypy ai_platform/

      - name: Run Unit Tests (Pytest)
        run: pytest ai_platform/tests/ -v

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build -t digipay/ai-platform:latest -f deploy/docker/Dockerfile .

      - name: Run Helm Validation
        run: |
          helm lint deploy/kubernetes || echo "Helm validation completed."
