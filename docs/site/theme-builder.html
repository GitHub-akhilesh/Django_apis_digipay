<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiPay Chat SDK — Visual Theme Builder</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }
    aside {
      width: 320px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { font-size: 20px; color: var(--accent); }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label { font-size: 13px; color: var(--text-sub); }
    input[type="color"], select, input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
    main {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .preview-box {
      flex: 1;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    pre {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      overflow-x: auto;
    }
    .btn {
      padding: 10px 16px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <aside>
    <div>
      <nav><a href="index.html">← Back to DevPortal</a></nav>
      <h1 style="margin-top: 10px;">🎨 Theme Builder</h1>
    </div>

    <div class="control-group">
      <label>Primary Brand Color</label>
      <input type="color" id="primaryColor" value="#38bdf8" onchange="updatePreview()">
    </div>

    <div class="control-group">
      <label>Widget Mode</label>
      <select id="modeSelect" onchange="updatePreview()">
        <option value="floating">Floating Launcher</option>
        <option value="sidebar">Sidebar Panel</option>
        <option value="inline">Inline Container</option>
      </select>
    </div>

    <div class="control-group">
      <label>Base Theme</label>
      <select id="themeSelect" onchange="updatePreview()">
        <option value="dark">Dark Mode</option>
        <option value="light">Light Mode</option>
      </select>
    </div>

    <button class="btn" onclick="copyConfig()">📋 Export Theme Config JSON</button>
  </aside>

  <main>
    <h2>Live Interactive Widget Preview</h2>
    <div class="preview-box" id="previewContainer">
      <div id="mockWidget" style="padding: 24px; background: #0f172a; border-radius: 12px; border: 2px solid #38bdf8; color: #fff; width: 300px; text-align: center;">
        <h3 id="mockTitle" style="color:#38bdf8;">⚡ DigiPay AI Support</h3>
        <p style="font-size:13px; color:#94a3b8; margin: 12px 0;">Hello! How can I assist with your merchant account today?</p>
        <button style="width:100%; padding:8px; background:#38bdf8; border:none; border-radius:6px; color:#000; font-weight:600;">Start Session</button>
      </div>
    </div>

    <h2>Exported React Integration Code</h2>
    <pre><code id="codeExport">&lt;DigiPayChatWidget cscId="500100100014" mode="floating" theme="dark" primaryColor="#38bdf8" /&gt;</code></pre>
  </main>

  <script>
    function updatePreview() {
      const color = document.getElementById('primaryColor').value;
      const mode = document.getElementById('modeSelect').value;
      const theme = document.getElementById('themeSelect').value;

      document.getElementById('mockWidget').style.borderColor = color;
      document.getElementById('mockTitle').style.color = color;

      const codeStr = `<DigiPayChatWidget cscId="500100100014" mode="${mode}" theme="${theme}" primaryColor="${color}" />`;
      document.getElementById('codeExport').innerText = codeStr;
    }

    function copyConfig() {
      const color = document.getElementById('primaryColor').value;
      const mode = document.getElementById('modeSelect').value;
      const theme = document.getElementById('themeSelect').value;
      const jsonStr = JSON.stringify({ primaryColor: color, mode, theme }, null, 2);
      navigator.clipboard.writeText(jsonStr);
      alert('Theme JSON copied to clipboard!');
    }
  </script>
</body>
</html>
